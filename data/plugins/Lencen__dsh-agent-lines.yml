url: https://github.com/Lencen/dsh-agent-lines
name: Lencen/dsh-agent-lines
category: agi
description:
  en: "Long-lived role lines for DSH: stable role identity plus a replaceable Session, durable messages, structured handoffs, retire and hibernate, and a read-only board. Models positions, not a fixed workflow or DAG."
  zh: "DSH 的长期角色线：稳定角色身份 + 可替换 Session、持久消息、结构化交接、退役/休眠、只读看板。它把线当成岗位，不预设固定流程或 DAG。"
